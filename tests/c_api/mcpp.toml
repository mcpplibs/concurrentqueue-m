# The C API through the module: its own project, for the c-api feature (and,
# here, gtest with no-thread-local, which GCC needs beside <cxxabi.h>).
[package]
name        = "concurrentqueue-c-api-tests"
version     = "0.1.0"
description = "mcpplibs.mwrap.concurrentqueue with the c-api and no-thread-local features"

[dependencies]
"mcpplibs.mwrap.concurrentqueue" = { path = "../..", features = ["c-api", "no-thread-local"] }

[dev-dependencies]
compat.gtest = "1.15.2"
